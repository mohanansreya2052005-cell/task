<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body style="background-color: cadetblue;">
    <div class="container">
        <div class="row">
            <div class="col-4"></div>
            <div class="col-4">
                <h1 class="text-center text-light mt-4 p-3 " style="font-size: 30px;">Task Tracker</h1>
                    <div class="flex items-center">
                       <input id="textinput" type="text" class="form-control" style="width: 400px;">
                       <textarea id="descinput" class="form-control mb-2 ms-2" placeholder="Enter task description"></textarea>
                       <button onclick="addtask()" type="button" class="ms-2 text sm font-medium text-white rounded-"><img src="https://tse3.mm.bing.net/th/id/OIP.7ZPuAXvSvyoxwc7Qcy79eQAAAA?r=0&w=256&h=256&rs=1&pid=ImgDetMain&o=7&rm=3"  width="70px" style="border-radius: 25px;" ></button>

                  </div >
                   <dl id="list">



                   </dl>

            </div>
            <div class="col-4"></div>
        </div>
          
      
    </div>
    

<script>

function addtask(){
   
    let task=document.getElementById("textinput").value 
     let desc = document.getElementById("descinput").value
    
   
    let dt=document.createElement("dt")
        dt.textContent = title;

  let dd = document.createElement("dd");
  dd.innerHTML = `
    ${desc}
    <div class="mt-2">
      <button type="button" onclick="editTask(this)"><img src="https://th.bing.com/th/id/OIP.0H2QIwEywGZRKEugW1_atgHaHa?w=188&h=188&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" width="40px"></button>
      <button type="button" onclick="deleteTask(this)">Delete</button>
      <button type="button" onclick="toggleStatus(this)">Mark Completed</button>
    </div>`
  
     document.getElementById("list").appendChild(dt)
     document.getElementById("list").appendChild(dd)


     document.getElementById("textinput").value = "";
     document.getElementById("descinput").value = "";




}







</script>



</body>


</html>
